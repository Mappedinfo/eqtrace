[project]
name = "eqtrace"
version = "0.1.0"
description = "Code for: EqTrace: Executable Equation Contracts for Paper-Code Consistency"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.optional-dependencies]
proof = ["z3-solver>=4.13,<5"]

[project.scripts]
eqtrace = "eqtrace.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqtrace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
